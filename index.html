<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SNTIN Processor</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="styles.css" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>

  <div class="layout-wrapper">
    
    <!-- ЛЕВАЯ ПАНЕЛЬ: Управление (Upload, Buttons) -->
    <aside class="pane-controls">
      <div class="pane-header">
        <div class="logo-area">
          <span class="material-symbols-outlined logo-icon">data_object</span>
          <div>
            <h1>SNTIN Processor</h1>
            <p>JSON Parser & Validator</p>
          </div>
        </div>
        <button id="themeToggle" class="btn-icon" aria-label="Toggle Dark Mode">
          <span class="material-symbols-outlined">dark_mode</span>
        </button>
      </div>

      <div class="pane-body">
        <!-- Зона загрузки -->
        <div class="upload-container" id="dropZone">
          <input type="file" id="jsonFile" accept=".json" class="file-input">
          <div class="upload-content">
            <span class="material-symbols-outlined upload-icon-md3">cloud_upload</span>
            <span class="upload-text">Перетащите JSON файл</span>
            <span class="file-name fade-in" id="fileNameDisplay"></span>
          </div>
        </div>

        <button id="processBtn" class="btn-filled-primary mt-3 mb-4">
          <span class="material-symbols-outlined">auto_fix_high</span>
          Обработать данные
        </button>

        <!-- Кнопки экспорта (всегда видны, но disabled до обработки) -->
        <div id="actionsContainer" class="actions-section disabled">
          <h6 class="section-label">Экспорт данных</h6>
          <div class="actions-grid-md3">
            <button id="downloadBtn" class="btn-outlined action-card" disabled>
              <span class="material-symbols-outlined">folder_zip</span>
              <span>Скачать Полный список</span>
            </button>
            <button id="downloadUsnBtn" class="btn-outlined action-card" disabled>
              <span class="material-symbols-outlined">inventory_2</span>
              <span>Скачать Unit Serial</span>
            </button>
            <button id="downloadSntinBtn" class="btn-outlined action-card" disabled>
              <span class="material-symbols-outlined">qr_code_2</span>
              <span>Скачать Sntins</span>
            </button>
          </div>
        </div>
      </div>
    </aside>

    <!-- ПРАВАЯ ПАНЕЛЬ: Данные (Ошибки, Таблица) -->
    <main class="pane-data" id="dataPane">
      
      <!-- Заглушка (Empty State) -->
      <div id="emptyState" class="empty-state">
        <span class="material-symbols-outlined empty-icon">table_view</span>
        <h3>Нет данных для отображения</h3>
        <p>Загрузите файл, чтобы увидеть результат</p>
      </div>

      <!-- Контейнер с результатами -->
      <div id="resultsContainer" style="display: none;">
        
        <!-- Блок ошибок -->
        <div id="errorContainer" class="error-container-md3 mb-4" style="display:none;">
          <div class="error-header">
            <div class="d-flex align-items-center gap-3">
              <div class="icon-circle-error">
                <span class="material-symbols-outlined">warning</span>
              </div>
              <div>
                <h5 class="m-0">Внимание!</h5>
                <p class="small m-0 opacity-75">Кодов с ошибкой длины: <span id="errorCount">0</span></p>
              </div>
            </div>
            <button id="downloadErrorsBtn" class="btn-tonal-error">
              <span class="material-symbols-outlined">download</span>
              Скачать
            </button>
          </div>
          <div class="stats-chips">
            <span class="chip error">SNTIN эталон: <b id="expectedSntinLen">-</b></span>
            <span class="chip error">Unit эталон: <b id="expectedUnitLen">-</b></span>
          </div>
          <div class="table-wrapper-md3 error-wrapper">
            <!-- Таблица ошибок остается скроллящейся, так как там обычно меньше данных, но можно тоже сделать пагинацию при желании -->
            <div id="errorTablePreview"></div>
          </div>
        </div>

        <!-- Поиск и Таблица -->
        <div class="data-header">
          <h2 class="m-0">Данные</h2>
          <div class="search-bar-md3">
            <span class="material-symbols-outlined">search</span>
            <input type="text" id="searchInput" placeholder="Поиск по кодам...">
          </div>
        </div>

        <div class="table-wrapper-md3 main-table-wrapper">
          <div id="tablePreview"></div>
        </div>
        
        <!-- ПАГИНАЦИЯ -->
        <div id="pagination" class="pagination-container"></div>
      </div>

    </main>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <script src="script.js"></script>
</body>
</html>
